<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MicroLearning Admin</title>
    {% include '_theme.html' %}
</head>
<body class="antialiased">
    <div class="min-h-screen flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md">
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-16 h-16 mb-6 rounded-lg" style="background: hsl(var(--primary) / 0.1); border: 1px solid hsl(var(--primary) / 0.3);">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: hsl(var(--primary));">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                </div>
                <h1 class="text-3xl font-semibold tracking-tight mb-2" style="color: hsl(var(--foreground));">MicroLearning</h1>
                <p class="text-sm font-medium" style="color: hsl(var(--muted-foreground));">Admin Dashboard</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="mb-6 space-y-2">
                        {% for category, message in messages %}
                            <div class="px-4 py-3 rounded-lg text-sm font-medium"
                                 style="{% if category in ['error', 'danger'] %}background: hsl(var(--destructive) / 0.12); border: 1px solid hsl(var(--destructive) / 0.4); color: hsl(var(--foreground));{% else %}background: hsl(var(--muted)); border: 1px solid hsl(var(--border)); color: hsl(var(--foreground));{% endif %}"
                                 role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium mb-2" style="color: hsl(var(--foreground));">Username</label>
                    <input type="text" id="username" name="username" required autofocus
                           class="w-full px-4 py-3 text-sm rounded-lg focus:outline-none focus:ring-2 transition-all duration-150"
                           style="background: hsl(var(--card)); color: hsl(var(--foreground)); border: 1px solid hsl(var(--input)); box-shadow: none;"
                           onfocus="this.style.boxShadow = '0 0 0 2px hsl(var(--ring))'" onblur="this.style.boxShadow = 'none'"
                           placeholder="Enter your username">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium mb-2" style="color: hsl(var(--foreground));">Password</label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-3 text-sm rounded-lg focus:outline-none focus:ring-2 transition-all duration-150"
                           style="background: hsl(var(--card)); color: hsl(var(--foreground)); border: 1px solid hsl(var(--input)); box-shadow: none;"
                           onfocus="this.style.boxShadow = '0 0 0 2px hsl(var(--ring))'" onblur="this.style.boxShadow = 'none'"
                           placeholder="Enter your password">
                </div>

                <button type="submit"
                        class="w-full px-4 py-3 text-sm font-semibold rounded-lg transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-offset-2"
                        style="background: hsl(var(--primary)); color: hsl(var(--primary-foreground));"
                        onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
                    Sign In
                </button>
            </form>

            <div class="mt-8 text-center">
                <p class="text-xs" style="color: hsl(var(--muted-foreground));">Secure authentication required for dashboard access</p>
            </div>
        </div>
    </div>
</body>
</html>
