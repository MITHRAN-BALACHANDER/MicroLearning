{% extends "base.html" %}

{% block title %}Edit Video{% endblock %}
{% block page_title %}Edit Video{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="bi bi-pencil"></i> Edit Video: {{ video.title }}</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">Title *</label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ video.title }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ video.description or '' }}</textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="file_id" class="form-label">File Path/ID</label>
                        <input type="text" class="form-control" id="file_id" name="file_id" value="{{ video.file_id }}" placeholder="Leave blank to keep current">
                        <small class="text-muted">Current: {{ video.file_id[:50] }}...</small>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="duration" class="form-label">Duration (seconds)</label>
                                <input type="number" class="form-control" id="duration" name="duration" value="{{ video.duration or '' }}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="difficulty" class="form-label">Difficulty Level</label>
                                <select class="form-select" id="difficulty" name="difficulty">
                                    <option value="1" {{ 'selected' if video.difficulty_level == 1 }}>⭐ Easy</option>
                                    <option value="2" {{ 'selected' if video.difficulty_level == 2 }}>⭐⭐ Medium</option>
                                    <option value="3" {{ 'selected' if video.difficulty_level == 3 }}>⭐⭐⭐ Hard</option>
                                    <option value="4" {{ 'selected' if video.difficulty_level == 4 }}>⭐⭐⭐⭐ Expert</option>
                                    <option value="5" {{ 'selected' if video.difficulty_level == 5 }}>⭐⭐⭐⭐⭐ Master</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('videos') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Update Video
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
