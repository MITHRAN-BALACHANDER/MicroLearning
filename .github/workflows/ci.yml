name: CI

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches: ["**"]          # every push on every branch
  pull_request:
    branches: [master, main, develop]

# Cancel in-flight runs for the same branch on new pushes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  BOT_IMAGE: ${{ github.repository }}/microlearning-bot
  WEB_IMAGE: ${{ github.repository }}/microlearning-web

# ─── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Python lint ──────────────────────────────────────────────────────────
  python-lint:
    name: Python · Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Agents

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Agents/requirements.txt

      - name: Install lint tools
        run: pip install flake8 flake8-bugbear flake8-comprehensions

      - name: Run flake8
        run: |
          flake8 . \
            --exclude=__pycache__,.venv,data,logs,tests \
            --max-line-length=120 \
            --extend-ignore=E203,W503


  # ── 2. Python security scan ────────────────────────────────────────────────
  python-security:
    name: Python · Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Agents

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Agents/requirements.txt

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Run bandit (SAST)
        run: |
          bandit -r . \
            --exclude ./tests,./data,./logs \
            --severity-level medium \
            --confidence-level medium \
            -f json -o bandit-report.json || true
          bandit -r . \
            --exclude ./tests,./data,./logs \
            --severity-level high \
            --confidence-level high

      - name: Run pip-audit (dependency CVEs)
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-w596-4wvx-j9j6

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: Agents/bandit-report.json
          retention-days: 14


  # ── 3. Python unit tests ───────────────────────────────────────────────────
  python-test:
    name: Python · Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Agents

    # Test against multiple Python versions
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Agents/requirements.txt

      # Heavy deps (chromadb, sentence-transformers, telegram) are imported
      # lazily by the agents, so the test suite only needs this light set.
      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install \
            sqlalchemy==2.0.23 \
            python-dotenv==1.0.0 \
            loguru==0.7.2 \
            httpx==0.25.2 \
            Flask==3.0.0 \
            pytest==7.4.3 \
            pytest-asyncio==0.21.1 \
            pytest-cov==4.1.0

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///:memory:
          MESSAGING_PLATFORM: both
          TELEGRAM_BOT_TOKEN: fake:token
          GEMINI_API_KEY: fake-key
          AGNO_API_KEY: fake-key
          WHATSAPP_ACCESS_TOKEN: fake-wa-token
          WHATSAPP_PHONE_NUMBER_ID: "111222333444555"
          WHATSAPP_VERIFY_TOKEN: fake-verify-token
          WHATSAPP_APP_SECRET: fake-app-secret
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: Agents/coverage.xml
          flags: python
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}


  # ── 4. Next.js lint + type-check ───────────────────────────────────────────
  nextjs-lint:
    name: Next.js · Lint & Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Agents/nextjs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Agents/nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: file:./test.db

      - name: ESLint
        run: npm run lint -- --max-warnings 0

      - name: TypeScript type-check
        run: npx tsc --noEmit


  # ── 5. Next.js build ───────────────────────────────────────────────────────
  nextjs-build:
    name: Next.js · Build
    runs-on: ubuntu-latest
    needs: [nextjs-lint]
    defaults:
      run:
        working-directory: Agents/nextjs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Agents/nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: file:./test.db

      - name: Build Next.js
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: file:./test.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-secret-placeholder
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-${{ github.sha }}
          path: Agents/nextjs/.next/
          retention-days: 1


  # ── 6. Docker build — Bot ──────────────────────────────────────────────────
  docker-bot:
    name: Docker · Bot Image
    runs-on: ubuntu-latest
    needs: [python-lint, python-test]
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BOT_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build (and push on non-PR)
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.BOT_IMAGE }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-bot.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
        continue-on-error: true   # report but don't block; harden as needed

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-bot.sarif
          category: trivy-bot


  # ── 7. Docker build — Web ──────────────────────────────────────────────────
  docker-web:
    name: Docker · Web Image
    runs-on: ubuntu-latest
    needs: [nextjs-build]
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build (and push on non-PR)
        uses: docker/build-push-action@v5
        with:
          context: Agents/nextjs
          dockerfile: Agents/nextjs/Dockerfile
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-web.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
        continue-on-error: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web


  # ── 8. Summary gate ───────────────────────────────────────────────────────
  ci-passed:
    name: CI · All checks passed
    runs-on: ubuntu-latest
    if: always()
    needs:
      - python-lint
      - python-security
      - python-test
      - nextjs-lint
      - nextjs-build
      - docker-bot
      - docker-web
    steps:
      - name: Check all jobs succeeded
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | python3 -c "
          import json, sys
          jobs = json.load(sys.stdin)
          failed = [name for name, data in jobs.items() if data['result'] not in ('success', 'skipped')]
          if failed:
              print('FAILED jobs:', ', '.join(failed))
              sys.exit(1)
          print('All CI jobs passed.')
          "
